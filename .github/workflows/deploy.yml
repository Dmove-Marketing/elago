name: Deploy to VPS

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy files via rsync
        run: |
          DOMAIN=$(node -e "const c=require('./config.json'); console.log(c.deploy.remote_path.split('/').pop())")
          echo "Deploying to /var/www/$DOMAIN"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/$DOMAIN/

      - name: Obtain SSL certificate if needed
        run: |
          DOMAIN=$(node -e "const c=require('./config.json'); console.log(c.deploy.remote_path.split('/').pop())")

          CERT_EXISTS=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "[ -f /etc/letsencrypt/live/$DOMAIN/fullchain.pem ] && echo yes || echo no" 2>/dev/null || echo no)

          echo "Cert exists: $CERT_EXISTS"

          if [ "$CERT_EXISTS" != "yes" ]; then
            echo "Cert nao encontrado — configurando HTTP temporario e obtendo certificado..."

            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
              "printf 'server{listen 80;server_name $DOMAIN www.$DOMAIN;root /var/www/$DOMAIN;location /.well-known/acme-challenge/{try_files \$uri =404;}location /{return 200 ok;add_header Content-Type text/plain;}}' \
                 > /etc/nginx/sites-available/$DOMAIN && \
               ln -sf /etc/nginx/sites-available/$DOMAIN /etc/nginx/sites-enabled/$DOMAIN && \
               nginx -t && systemctl reload nginx && \
               certbot certonly --webroot -w /var/www/$DOMAIN \
                 -d $DOMAIN \
                 -m dev@dmove.com.br --agree-tos --non-interactive"
          fi

      - name: Configure nginx vhost
        run: |
          DOMAIN=$(node -e "const c=require('./config.json'); console.log(c.deploy.remote_path.split('/').pop())")
          ESC=$(echo "$DOMAIN" | sed 's/\./\\./g')

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            server/nginx.conf \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/etc/nginx/sites-available/$DOMAIN

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
              set -e
              echo '=== Removendo $DOMAIN de outros vhosts ==='
              for f in \$(grep -rl '$ESC' /etc/nginx/sites-enabled/ 2>/dev/null); do
                if [ \"\$(basename \"\$f\")\" != \"$DOMAIN\" ]; then
                  echo \"  Limpando \$f\"
                  sed -i 's/ www\.$ESC//g; s/ $ESC//g; s/www\.$ESC //g; s/$ESC //g' \"\$f\"
                fi
              done
              echo '=== Criando symlink ==='
              ln -sf /etc/nginx/sites-available/$DOMAIN /etc/nginx/sites-enabled/$DOMAIN
              echo '=== nginx -t ==='
              nginx -t
              echo '=== reload nginx ==='
              systemctl reload nginx
              echo OK
            "
